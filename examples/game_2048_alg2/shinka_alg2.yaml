# === ALG2 MOD (aux-selection): game_2048 TREATMENT config. Local Qwen via vLLM. ===
# Generation + novelty: Qwen2.5-32B-Instruct-AWQ at http://localhost:8000/v1
# Embeddings: Qwen3-Embedding-0.6B at http://localhost:8001/v1
# No API keys; local models ~free, so num_generations is the stopping criterion.

max_evaluation_jobs: 4
max_proposal_jobs: 4
max_db_workers: 4

db_config:
  num_islands: 2
  archive_size: 40
  elite_selection_ratio: 0.3
  num_archive_inspirations: 1
  num_top_k_inspirations: 1
  migration_interval: 10
  migration_rate: 0.1
  island_elitism: true
  enforce_island_separation: true
  parent_selection_strategy: weighted

  # === ALG2 MOD (aux-selection): 5 structural aux arms + direction priors. ===
  # Aux scores come from private_metrics["aux_scores"] (written by evaluate.py from the
  # board trajectory); they are NEVER shown to the model -- pure selection intervention.
  # All priors +1: the experiment learns which of the five actually predict good play
  # (earn q_aux weight) and which do not.
  aux_directions:
    empty: 1        # maximize: mean fraction of empty cells (room to maneuver)
    monotonic: 1    # maximize: rows/cols ordered like a staircase
    smooth: 1       # maximize: adjacent occupied tiles have similar values (mergeable)
    corner: 1       # maximize: max tile anchored in a corner
    merge: 1        # maximize: adjacent equal tiles ready to merge
  # Regress the oracle out of each aux before selecting, so an aux arm picks by the
  # structure the oracle does NOT already capture (else it re-picks the oracle's parents).
  aux_residualize: true
  # === END ALG2 MOD (aux-selection) ===
  parent_selection_lambda: 10
  archive_selection_strategy: "crowding"
  island_selection_strategy: equal
  archive_criteria:
    combined_score: 1.0
    loc: -0.3
  enable_dynamic_islands: false
  stagnation_threshold: 10
  island_spawn_strategy: "best"
  island_spawn_subtree_size: 2

evo_config:
  # Qwen at temp>0 can't apply diff SEARCH/REPLACE reliably; use `full` (rewrite the whole
  # EVOLVE-BLOCK). Native ShinkaEvolve patch type.
  patch_types:
    - full
  patch_type_probs:
    - 1.0

  num_generations: 200
  max_api_costs: 1000.0     # local models ~free; never binds (stop on generations)

  max_patch_resamples: 4
  max_patch_attempts: 1
  max_novelty_attempts: 1
  job_type: local
  language: python

  # --- LOCAL Qwen generation model (served by vLLM) ---
  llm_models:
    - "local/qwen32b@http://localhost:8000/v1"
  llm_kwargs:
    temperatures:
      - 0.7               # temp 0 => deterministic repeats of the same bug; 0.7 diversifies
    reasoning_efforts:
      - ""
    max_tokens: 8192

  llm_dynamic_selection: null

  enable_controlled_oversubscription: false
  proposal_target_mode: adaptive
  proposal_target_min_samples: 8
  proposal_target_ratio_cap: 1.75
  proposal_buffer_max: 6
  proposal_target_hard_cap: 26
  proposal_target_ewma_alpha: 0.25

  meta_rec_interval: null
  meta_llm_models:
    - "local/qwen32b@http://localhost:8000/v1"
  meta_llm_kwargs:
    temperatures:
      - 0.0
    max_tokens: 8192

  embedding_model: "local/qwen-embed@http://localhost:8001/v1"
  code_embed_sim_threshold: 0.99

  novelty_llm_models:
    - "local/qwen32b@http://localhost:8000/v1"
  novelty_llm_kwargs:
    temperatures:
      - 0.0

  init_program_path: initial.py
  # === ALG2 MOD (aux-selection): two-level bandit knobs (calibrated for ~200 gens). ===
  aux_bandit_kwargs:
    beta_init: 0.70      # start trusting the oracle arm, ~30% left for the aux pool
    beta_floor: 0.40     # oracle keeps a substantial share
    beta_cap: 0.90       # aux pool never starved (>=10%)
    beta_step: 0.05
    kappa: 5.0
    decay: 0.80          # eta=0.2 -> converges within ~20 pulls per aux
    reward_clip: 2.0
    tau: 0.15            # within-pool softmax temperature over q_aux
    epsilon: 0.15        # softmax exploration floor: no aux ever starved
  # === END ALG2 MOD (aux-selection) ===

  results_dir: results/default
  evolve_prompts: False
# === END ALG2 MOD (aux-selection) ===
