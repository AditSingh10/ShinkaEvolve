# Common settings for every condition. Family-policy parameters are CLI arguments.
generation_model: "local/qwen32b@http://127.0.0.1:8000/v1"
embedding_model: "local/qwen-embed@http://127.0.0.1:8001/v1"
temperature: 0.7
max_tokens: 8192
max_patch_resamples: 1
max_patch_attempts: 1
max_novelty_attempts: 1
novelty_rejection: false
validity_steering: false
auxiliary_selection: false
repair: false

# Used only by the warmup_validity condition. This controller can modify prompts only.
warmup_validity:
  enabled: true
  validity_ema_alpha: 0.15
  lambda_lr: 0.10
  target_violation_rate: 0.15
  lambda_on: 0.60
  lambda_off: 0.25
  violation_rate_on: 0.30
  violation_rate_off: 0.15
  num_failure_witnesses: 3
  witness_buffer_size: 12
  controller_warmup: 20
  controller_check_interval: 5
  trigger_confirmation_checks: 2
  release_confirmation_checks: 2
